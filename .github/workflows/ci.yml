name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kasirku_test
          MYSQL_USER: kasirku
          MYSQL_PASSWORD: kasirku
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Generate .env (secrets + DB pointing at the MySQL service)
        run: |
          cp .env.example .env
          APP_KEY="$(openssl rand -hex 16)"           # 32 chars, as the config requires
          JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n' | tr '/+' '_-')"
          sed -i \
            -e "s#^APP_KEY=.*#APP_KEY=${APP_KEY}#" \
            -e "s#^JWT_SECRET=.*#JWT_SECRET=${JWT_SECRET}#" \
            -e "s#^DB_HOST=.*#DB_HOST=127.0.0.1#" \
            -e "s#^DB_DATABASE=.*#DB_DATABASE=kasirku_test#" \
            -e "s#^DB_USERNAME=.*#DB_USERNAME=kasirku#" \
            -e "s#^DB_PASSWORD=.*#DB_PASSWORD=kasirku#" \
            .env

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./app/...

      - name: Feature tests (needs MySQL)
        run: go test ./tests/...

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: kasirku-backend:ci
