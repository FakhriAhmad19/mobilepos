# Kasirku Mobile — production nginx (PRD Phase 9): TLS termination + reverse
# proxy to the Goravel backend. Expects certificates mounted at
# /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem
# (Let's Encrypt output, or the self-signed pair from scripts/gen-self-signed-cert.sh).

upstream kasirku_backend {
    server backend:3000;
}

# --- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    server_name _;

    # Allow ACME HTTP-01 challenges through if you use webroot certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: terminate TLS and proxy to the backend -------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern, secure defaults.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: force HTTPS for a year (only enable once TLS is confirmed working).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://kasirku_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
