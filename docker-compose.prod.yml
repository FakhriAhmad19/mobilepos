# Kasirku Mobile — production orchestration (PRD Phase 9).
#
# Usage:
#   cp .env.prod.example .env      # fill in real secrets (see docs/DEPLOYMENT.md)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (dev):
#   - backend built from the hardened Dockerfile.prod (non-root, healthcheck)
#   - no host bind mounts / no exposed DB port (MySQL is internal only)
#   - nginx terminates TLS on 443 and redirects 80 → 443
#   - APP_ENV=production, APP_DEBUG=false
#   - secrets come from the root .env, never baked into an image

services:
  mysql:
    image: mysql:8.4
    container_name: kasirku_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kasirku}
      MYSQL_USER: ${MYSQL_USER:-kasirku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    # No published port: the database is reachable only on the internal network.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - kasirku

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: kasirku_backend_prod
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-KasirkuMobile}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_URL: ${APP_URL:?set APP_URL in .env}
      APP_KEY: ${APP_KEY:?set APP_KEY in .env (32 chars)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-kasirku}
      DB_USERNAME: ${MYSQL_USER:-kasirku}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kasirku

  nginx:
    image: nginx:1.27-alpine
    container_name: kasirku_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Provide fullchain.pem + privkey.pem here (Let's Encrypt or self-signed).
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - kasirku

volumes:
  mysql_data:

networks:
  kasirku:
    driver: bridge
